<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nkoumou Tjade Grinnel Germain — Software · Networks · Systems &amp; IoT · Security">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .spin { transform-origin: 985px 140px; animation: spin 60s linear infinite; }
    .spin-rev { transform-origin: 985px 140px; animation: spin 90s linear infinite reverse; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .pulse.d1 { animation-delay: -0.6s; } .pulse.d2 { animation-delay: -1.2s; } .pulse.d3 { animation-delay: -1.8s; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .trace { stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
    .scan { animation: scan 7s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: 0.35; } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes scan { 0%, 100% { transform: translateX(-260px); opacity: 0; } 15%, 85% { opacity: 1; } 50% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) {
      .spin, .spin-rev, .pulse, .ping, .caret, .trace, .scan { animation: none; }
      .packet { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.5" stop-color="#101827"/>
      <stop offset="0.8" stop-color="#172B46"/>
      <stop offset="1" stop-color="#263B5B"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(985 140) scale(360)">
      <stop stop-color="#3E6A9E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3E6A9E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(40 260) rotate(-45) scale(300)">
      <stop stop-color="#7CA5D8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7CA5D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CA5D8"/>
      <stop offset="1" stop-color="#3E6A9E"/>
    </linearGradient>
    <linearGradient id="hex" x1="914" y1="58" x2="1056" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4DCF7"/>
      <stop offset="1" stop-color="#3E6A9E"/>
    </linearGradient>
    <linearGradient id="traceFade" x1="560" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CA5D8" stop-opacity="0"/>
      <stop offset="1" stop-color="#7CA5D8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CA5D8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7CA5D8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7CA5D8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7CA5D8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 140) scale(620 300)">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </radialGradient>
    <mask id="gridFade"><rect width="1200" height="280" fill="url(#gridMask)"/></mask>
    <clipPath id="round">
      <rect width="1200" height="280" rx="24"/>
    </clipPath>
    <!-- Trajets des paquets : du texte vers le nœud central -->
    <path id="t1" d="M560 112H700L730 82H860L914 99"/>
    <path id="t2" d="M600 168H760L790 196H880L914 181"/>
    <path id="t3" d="M640 140H846"/>
  </defs>

  <!-- Fond -->
  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)" mask="url(#gridFade)"/>
    <rect width="1200" height="280" fill="url(#glowRight)"/>
    <rect width="1200" height="280" fill="url(#glowLeft)"/>
    <rect class="scan" width="260" height="280" fill="url(#scanGrad)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="23.5" stroke="#3E6A9E" stroke-opacity="0.35"/>

  <!-- Pistes réseau qui relient le texte au nœud -->
  <g stroke="url(#traceFade)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#t1"/>
    <use href="#t2"/>
    <use href="#t3"/>
  </g>
  <g stroke="#7CA5D8" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round">
    <path class="trace" d="M700 112L730 82H860"/>
    <path class="trace" d="M760 168L790 196H880"/>
  </g>
  <g fill="#0D1626" stroke="#7CA5D8" stroke-opacity="0.6" stroke-width="1.5">
    <circle cx="700" cy="112" r="3.5"/>
    <circle cx="730" cy="82" r="3.5"/>
    <circle cx="760" cy="168" r="3.5"/>
    <circle cx="790" cy="196" r="3.5"/>
    <rect x="755" y="134" width="12" height="12" rx="2"/>
  </g>

  <!-- Paquets en transit -->
  <g class="packet">
    <circle r="3" fill="#C4DCF7">
      <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#t1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#7CA5D8">
      <animateMotion dur="4.4s" begin="-1.5s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4.4s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="-5" y="-1.5" width="10" height="3" rx="1.5" fill="#9CC4F0">
      <animateMotion dur="2.8s" begin="-0.7s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" begin="-0.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Identité -->
  <g class="sans">
    <rect x="72" y="60" width="228" height="34" rx="17" fill="#0D1626" stroke="#3E6A9E" stroke-opacity="0.75"/>
    <circle class="ping" cx="93" cy="77" r="4" fill="#7CA5D8"/>
    <circle cx="93" cy="77" r="4" fill="#7CA5D8"/>
    <text x="107" y="82" class="mono" font-size="11.5" font-weight="600" letter-spacing="2.2" fill="#A9BCD4">ENGINEERING STUDENT</text>

    <text x="72" y="146" font-size="25" font-weight="600" letter-spacing="8" fill="#7CA5D8">NKOUMOU TJADE</text>
    <text x="70" y="204" font-size="62" font-weight="800" letter-spacing="-1" fill="#FFFFFF">Grinnel Germain</text>
    <rect x="72" y="225" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="258" class="mono" font-size="14" letter-spacing="0.5" fill="#A9BCD4"><tspan fill="#7CA5D8">&gt;</tspan> software · networks · systems &amp; IoT · security</text>
    <rect class="caret" x="510" y="246" width="8" height="15" rx="1" fill="#7CA5D8"/>
  </g>

  <!-- Nœud / monogramme -->
  <g>
    <circle cx="985" cy="140" r="132" stroke="#3E6A9E" stroke-opacity="0.16"/>
    <g class="spin">
      <circle cx="985" cy="140" r="112" stroke="#7CA5D8" stroke-opacity="0.3" stroke-dasharray="3 10"/>
      <circle cx="985" cy="28" r="3" fill="#9CC4F0"/>
    </g>
    <g class="spin-rev">
      <circle cx="985" cy="140" r="124" stroke="#7CA5D8" stroke-opacity="0.12" stroke-dasharray="40 18 6 18"/>
    </g>

    <g stroke="#3E6A9E" stroke-width="1.5" stroke-opacity="0.5">
      <path d="M1104 62L1044 95"/>
      <path d="M1128 152L1056 160"/>
      <path d="M1072 242L1018 198"/>
      <path d="M900 246L952 196"/>
      <path d="M892 60L944 90"/>
    </g>
    <g fill="#7CA5D8">
      <circle class="pulse" cx="1104" cy="62" r="4"/>
      <circle class="pulse d1" cx="1128" cy="152" r="3"/>
      <circle class="pulse d2" cx="1072" cy="242" r="5"/>
      <circle class="pulse d3" cx="900" cy="246" r="3"/>
      <circle class="pulse d1" cx="892" cy="60" r="3"/>
    </g>

    <polygon points="985,58 1056,99 1056,181 985,222 914,181 914,99" fill="#0D1524" fill-opacity="0.92" stroke="url(#hex)" stroke-width="2.5"/>
    <polygon points="985,78 1040,110 1040,170 985,202 930,170 930,110" fill="none" stroke="#7CA5D8" stroke-opacity="0.18" stroke-width="1.5"/>
    <text x="985" y="160" text-anchor="middle" class="sans" font-size="58" font-weight="800" fill="url(#hex)">NG</text>

    <g fill="#9CC4F0">
      <circle cx="985" cy="58" r="3.5"/>
      <circle cx="1056" cy="99" r="3.5"/>
      <circle cx="1056" cy="181" r="3.5"/>
      <circle cx="985" cy="222" r="3.5"/>
      <circle cx="914" cy="181" r="3.5"/>
      <circle cx="914" cy="99" r="3.5"/>
    </g>
  </g>
</svg>
