<svg width="900" height="282" viewBox="0 0 900 282" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development, Networks &amp; Security, Systems &amp; IoT">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
  <g class="card" style="animation-delay:0s">
    <rect x="0.5" y="0.5" width="287" height="281" rx="16" fill="#0D1626" stroke="#263B5B"/>
    <rect x="1" y="1" width="286" height="3" rx="1.5" fill="#7CA5D8" fill-opacity="0.85"/>
    <text x="22" y="38" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#7CA5D8">01 <tspan fill="#5B6B80">/</tspan></text>
    <text x="22" y="66" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">Development</text>
    <text x="22" y="92" class="sans" font-size="13" fill="#8B98A9">Building digital solutions and</text>
    <text x="22" y="110" class="sans" font-size="13" fill="#8B98A9">exploring software engineering.</text>
    <line x1="22" y1="132" x2="266" y2="132" stroke="#263B5B"/>
    <circle cx="26" cy="156" r="3" fill="#7CA5D8"/><text x="38" y="161" class="sans" font-size="13.5" fill="#C9D1D9">Web &amp; mobile applications</text>
    <circle cx="26" cy="180" r="3" fill="#7CA5D8"/><text x="38" y="185" class="sans" font-size="13.5" fill="#C9D1D9">Backend systems &amp; APIs</text>
    <circle cx="26" cy="204" r="3" fill="#7CA5D8"/><text x="38" y="209" class="sans" font-size="13.5" fill="#C9D1D9">Database management</text>
    <circle cx="26" cy="228" r="3" fill="#7CA5D8"/><text x="38" y="233" class="sans" font-size="13.5" fill="#C9D1D9">AI-powered solutions</text>
  </g>
  <g class="card" style="animation-delay:0.12s">
    <rect x="306.5" y="0.5" width="287" height="281" rx="16" fill="#0D1626" stroke="#263B5B"/>
    <rect x="307" y="1" width="286" height="3" rx="1.5" fill="#E07A7A" fill-opacity="0.85"/>
    <text x="328" y="38" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#E07A7A">02 <tspan fill="#5B6B80">/</tspan></text>
    <text x="328" y="66" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">Networks &amp; Security</text>
    <text x="328" y="92" class="sans" font-size="13" fill="#8B98A9">Understanding infrastructures,</text>
    <text x="328" y="110" class="sans" font-size="13" fill="#8B98A9">communication and protection.</text>
    <line x1="328" y1="132" x2="572" y2="132" stroke="#263B5B"/>
    <circle cx="332" cy="156" r="3" fill="#E07A7A"/><text x="344" y="161" class="sans" font-size="13.5" fill="#C9D1D9">Network configuration</text>
    <circle cx="332" cy="180" r="3" fill="#E07A7A"/><text x="344" y="185" class="sans" font-size="13.5" fill="#C9D1D9">Infrastructure labs</text>
    <circle cx="332" cy="204" r="3" fill="#E07A7A"/><text x="344" y="209" class="sans" font-size="13.5" fill="#C9D1D9">Traffic analysis</text>
    <circle cx="332" cy="228" r="3" fill="#E07A7A"/><text x="344" y="233" class="sans" font-size="13.5" fill="#C9D1D9">Security experiments</text>
    <circle cx="332" cy="252" r="3" fill="#E07A7A"/><text x="344" y="257" class="sans" font-size="13.5" fill="#C9D1D9">Technical documentation</text>
  </g>
  <g class="card" style="animation-delay:0.24s">
    <rect x="612.5" y="0.5" width="287" height="281" rx="16" fill="#0D1626" stroke="#263B5B"/>
    <rect x="613" y="1" width="286" height="3" rx="1.5" fill="#5FB3A9" fill-opacity="0.85"/>
    <text x="634" y="38" class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#5FB3A9">03 <tspan fill="#5B6B80">/</tspan></text>
    <text x="634" y="66" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">Systems &amp; IoT</text>
    <text x="634" y="92" class="sans" font-size="13" fill="#8B98A9">Where software meets</text>
    <text x="634" y="110" class="sans" font-size="13" fill="#8B98A9">physical systems.</text>
    <line x1="634" y1="132" x2="878" y2="132" stroke="#263B5B"/>
    <circle cx="638" cy="156" r="3" fill="#5FB3A9"/><text x="650" y="161" class="sans" font-size="13.5" fill="#C9D1D9">Embedded systems</text>
    <circle cx="638" cy="180" r="3" fill="#5FB3A9"/><text x="650" y="185" class="sans" font-size="13.5" fill="#C9D1D9">Microcontrollers</text>
    <circle cx="638" cy="204" r="3" fill="#5FB3A9"/><text x="650" y="209" class="sans" font-size="13.5" fill="#C9D1D9">Sensors &amp; electronics</text>
    <circle cx="638" cy="228" r="3" fill="#5FB3A9"/><text x="650" y="233" class="sans" font-size="13.5" fill="#C9D1D9">Hardware prototyping</text>
  </g>
</svg>
